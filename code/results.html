<!-- qa_app/templates/qa_app/results.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analysis Results</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f8f9fa;
            padding-top: 50px;
            padding-bottom: 50px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .result-section {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        h1 {
            font-weight: 700;
            color: #343a40;
            margin-bottom: 20px;
        }
        h3 {
            color: #007bff;
            margin-top: 20px;
        }
        p {
            font-size: 1.1em;
            color: #495057;
        }
        .thank-you {
            text-align: center;
            font-size: 1.2em;
            color: #28a745;
            margin-bottom: 20px;
        }
        .feedback {
            text-align: center;
            font-size: 1.1em;
            color: #343a40;
        }
        .btn-custom {
            background-color: #17a2b8;
            color: white;
            font-size: 1.1em;
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            transition: background-color 0.3s ease;
            margin-top: 15px;
        }
        .btn-custom:hover {
            background-color: #138496;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center">Analysis Results</h1>
        <div class="result-section">
            <h3>Extractive Answer:</h3>
            <p>{{ extractive_answer }}</p>
        </div>
        <div class="result-section">
            <h3>Generative Answer:</h3>
            <p>{{ generative_answer }}</p>
        </div>
        <div class="thank-you">
            <p>Thank you for using the Financial Causality Detection Tool!</p>
        </div>
        <div class="feedback">
            <p>We value your feedback. Let us know how we can improve the tool.</p>
            <a href="/" class="btn btn-custom">Analyze Another Document</a>
        </div>
    </div>
    <!-- Bootstrap JS (Optional for interactive components) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
